services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
    environment:
      NODE_ENV: production
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
